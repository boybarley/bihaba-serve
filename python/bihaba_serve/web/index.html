<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bihaba Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%222%22 y=%222%22 width=%2212%22 height=%2212%22 rx=%223%22 fill=%22%23ffb224%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#07090c; --panel:#0d1117; --panel2:#121821; --line:#1e2733; --line2:#2a3646;
  --ink:#e6edf3; --dim:#8b98a8; --mute:#5b6878;
  --amber:#ffb224; --amber-d:#3a2a08; --cyan:#3ee6c4; --cyan-d:#0b2f29; --red:#ff5d5d;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);overflow:hidden;
  background-image:radial-gradient(circle at 1px 1px,#ffffff08 1px,transparent 0);background-size:22px 22px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr 320px;grid-template-rows:52px 1fr;height:100vh}
/* ── top bar ───────────────────────────── */
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#0d1117,#090c10)}
.brand{font:700 15px var(--mono);letter-spacing:.12em;display:flex;align-items:center;gap:10px}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--amber);box-shadow:0 0 12px var(--amber);display:inline-block}
.brand small{color:var(--mute);font-weight:400;letter-spacing:.04em}
.pill{display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--line2);border-radius:999px;font:12px var(--mono);color:var(--dim);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.ok{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.dot.busy{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 1s infinite}
.dot.err{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.spacer{flex:1}
.iconbtn{background:none;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;color:var(--dim)}
.iconbtn:hover{color:var(--ink);border-color:var(--dim)}
.mobile-only{display:none}
/* ── sidebar ───────────────────────────── */
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#0a0d12cc}
.side .new{margin:12px;padding:10px;border-radius:var(--r);border:1px dashed var(--line2);background:none;color:var(--ink);text-align:left}
.side .new:hover{border-color:var(--amber);color:var(--amber)}
.chats{overflow:auto;flex:1;padding:0 8px 12px}
.chat-item{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;color:var(--dim);cursor:pointer}
.chat-item:hover{background:var(--panel2);color:var(--ink)}
.chat-item.active{background:var(--panel2);color:var(--ink);box-shadow:inset 2px 0 0 var(--amber)}
.chat-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item button{opacity:0;background:none;border:0;color:var(--mute);padding:0 4px}
.chat-item:hover button{opacity:1}
.chat-item button:hover{color:var(--red)}
.side .foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:6px}
.side .foot button{flex:1;font-size:12px}
/* ── main chat ─────────────────────────── */
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.log{flex:1;overflow:auto;padding:24px 0 12px}
.msg{max-width:820px;margin:0 auto 18px;padding:0 24px;display:grid;grid-template-columns:34px 1fr;gap:12px}
.av{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font:700 12px var(--mono)}
.user .av{background:var(--panel2);color:var(--dim);border:1px solid var(--line2)}
.bot .av{background:var(--amber-d);color:var(--amber);border:1px solid #6b4c10}
.body{min-width:0}
.user .bubble{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;white-space:pre-wrap;word-wrap:break-word}
.bot .bubble{padding:4px 0}
.bubble p{margin:.4em 0}
.bubble h1,.bubble h2,.bubble h3{margin:.8em 0 .3em;line-height:1.25}
.bubble h1{font-size:1.3em}.bubble h2{font-size:1.15em}.bubble h3{font-size:1.02em}
.bubble ul,.bubble ol{margin:.3em 0;padding-left:1.4em}
.bubble a{color:var(--cyan)}
.bubble code{font:12.5px var(--mono);background:var(--panel2);border:1px solid var(--line);padding:1px 5px;border-radius:5px}
.code{margin:.6em 0;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;background:#05070a}
.code header{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:var(--panel2);font:11px var(--mono);color:var(--dim)}
.code header button{background:none;border:0;color:var(--dim);font:11px var(--mono)}
.code header button:hover{color:var(--amber)}
.code pre{margin:0;padding:12px 14px;overflow:auto;font:12.5px/1.5 var(--mono)}
.code pre code{background:none;border:0;padding:0}
details.think{border-left:2px solid var(--line2);padding:2px 0 2px 12px;margin:4px 0 8px;color:var(--dim)}
details.think summary{cursor:pointer;font:12px var(--mono);color:var(--mute);list-style:none}
details.think summary::before{content:"▸ ";}
details.think[open] summary::before{content:"▾ ";}
details.think .tb{white-space:pre-wrap;font-size:13px;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:11px var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--panel)}
.chip b{color:var(--amber);font-weight:600}
.chip.c b{color:var(--cyan)}
.actions{display:flex;gap:4px;margin-top:6px;opacity:.0;transition:opacity .15s}
.msg:hover .actions{opacity:1}
.actions button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--mute);font:11px var(--mono);padding:2px 8px}
.actions button:hover{color:var(--ink);border-color:var(--line2)}
.err{color:var(--red);font:13px var(--mono)}
.caret{display:inline-block;width:8px;height:15px;background:var(--amber);vertical-align:-2px;animation:pulse .8s infinite;margin-left:2px}
.empty{max-width:640px;margin:10vh auto 0;padding:0 24px;text-align:center;color:var(--dim)}
.empty h1{font:700 30px var(--mono);letter-spacing:.06em;color:var(--ink);margin:0 0 6px}
.empty h1 span{color:var(--amber)}
.starters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px;text-align:left}
.starters button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;color:var(--dim)}
.starters button:hover{border-color:var(--amber);color:var(--ink)}
.starters b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
/* composer */
.composer{padding:10px 24px 18px}
.box{max-width:820px;margin:0 auto;border:1px solid var(--line2);border-radius:14px;background:var(--panel);padding:10px 10px 8px 14px;transition:border-color .15s}
.box:focus-within{border-color:var(--amber)}
.box textarea{width:100%;resize:none;border:0;background:none;outline:none;max-height:240px;min-height:24px}
.box .row{display:flex;align-items:center;gap:8px;margin-top:6px}
.hint{font:11px var(--mono);color:var(--mute)}
.send{margin-left:auto;background:var(--amber);color:#1a1200;border:0;border-radius:9px;padding:7px 16px;font-weight:700}
.send:disabled{opacity:.4;cursor:default}
.send.stop{background:var(--red);color:#fff}
/* ── right panel ───────────────────────── */
.panel{border-left:1px solid var(--line);overflow:auto;background:#0a0d12cc;padding:14px}
.sec{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:12px}
.sec h3{margin:0;padding:9px 12px;font:600 11px var(--mono);letter-spacing:.12em;color:var(--dim);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.sec .in{padding:10px 12px}
label{display:block;font-size:12px;color:var(--dim);margin:8px 0 4px}
label:first-child{margin-top:0}
select,input[type=text],input[type=password],input[type=number],.sec textarea{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;outline:none}
select:focus,input:focus,.sec textarea:focus{border-color:var(--amber)}
.sec textarea{resize:vertical;min-height:80px;font-size:13px}
.slider{display:grid;grid-template-columns:1fr 56px;gap:8px;align-items:center}
input[type=range]{accent-color:var(--amber);width:100%}
.slider input[type=number]{padding:4px 6px;font:12px var(--mono);text-align:right}
.btnrow{display:flex;gap:6px;margin-top:8px}
.btn{flex:1;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px;font-size:12px}
.btn:hover{border-color:var(--amber)}
.btn.primary{background:var(--amber-d);border-color:#6b4c10;color:var(--amber)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font:12px var(--mono)}
.kv dt{color:var(--mute)}
.kv dd{margin:0;color:var(--ink);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gauge{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}
.gauge .big{font:700 30px var(--mono);color:var(--amber)}
.gauge .unit{font:12px var(--mono);color:var(--dim)}
canvas{width:100%;height:56px;display:block}
.toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);padding:8px 14px;border-radius:8px;font:12px var(--mono);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:1100px){.app{grid-template-columns:220px 1fr}.panel{position:fixed;right:0;top:52px;bottom:0;width:320px;transform:translateX(100%);transition:transform .2s;z-index:5}.panel.open{transform:none}.mobile-only.pbtn{display:inline-block}}
@media (max-width:760px){.app{grid-template-columns:1fr}.side{position:fixed;left:0;top:52px;bottom:0;width:240px;transform:translateX(-100%);transition:transform .2s;z-index:5}.side.open{transform:none}.mobile-only{display:inline-block}.starters{grid-template-columns:1fr}.top .pill.hide-sm,.brand small{display:none}.top{gap:8px;padding:0 10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="iconbtn mobile-only" id="sideBtn" aria-label="Daftar percakapan">☰</button>
    <div class="brand"><i></i>BIHABA<small>console</small></div>
    <div class="pill"><span class="dot" id="dot"></span><span id="status">menghubungkan…</span></div>
    <div class="pill hide-sm" id="activePill">—</div>
    <div class="spacer"></div>
    <button class="iconbtn mobile-only pbtn" id="panelBtn" aria-label="Pengaturan">⚙</button>
  </header>

  <aside class="side" id="side">
    <button class="new" id="newChat">＋ Percakapan baru</button>
    <div class="chats" id="chats"></div>
    <div class="foot">
      <button class="iconbtn" id="exportMd" title="Ekspor percakapan ini sebagai Markdown">⇩ .md</button>
      <button class="iconbtn" id="exportJson" title="Ekspor semua percakapan (JSON)">⇩ .json</button>
      <button class="iconbtn" id="importJson" title="Impor JSON">⇧</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </aside>

  <main class="main">
    <div class="log" id="log" aria-live="polite"></div>
    <div class="composer">
      <div class="box">
        <textarea id="input" rows="1" placeholder="Tulis pesan… (Enter kirim, Shift+Enter baris baru)" aria-label="Pesan"></textarea>
        <div class="row">
          <span class="hint" id="hint">⌘K percakapan baru · Esc hentikan</span>
          <button class="send" id="send" disabled>Kirim</button>
        </div>
      </div>
    </div>
  </main>

  <aside class="panel" id="panel">
    <section class="sec">
      <h3>TELEMETRI <span id="lastFinish"></span></h3>
      <div class="in">
        <div class="gauge"><span class="big" id="gTps">—</span><span class="unit">tok/s decode</span></div>
        <canvas id="spark" width="600" height="112" aria-label="Grafik tok/s per balasan"></canvas>
        <dl class="kv" style="margin-top:8px">
          <dt>TTFT</dt><dd id="kTtft">—</dd>
          <dt>prefill</dt><dd id="kPre">—</dd>
          <dt>token/langkah</dt><dd id="kTps">—</dd>
          <dt>prefix dipakai ulang</dt><dd id="kReuse">—</dd>
        </dl>
      </div>
    </section>

    <section class="sec">
      <h3>MODEL</h3>
      <div class="in">
        <label for="model">Model aktif (ganti = hot-swap)</label>
        <select id="model"></select>
        <dl class="kv" style="margin-top:10px">
          <dt>arsitektur</dt><dd id="kArch">—</dd>
          <dt>MoE top-k</dt><dd id="kTopk">—</dd>
          <dt>konteks maks</dt><dd id="kSeq">—</dd>
          <dt>prefix di-bake</dt><dd id="kBaked">—</dd>
          <dt>request</dt><dd id="kReq">—</dd>
          <dt>uptime</dt><dd id="kUp">—</dd>
        </dl>
      </div>
    </section>

    <section class="sec">
      <h3>SYSTEM PROMPT</h3>
      <div class="in">
        <textarea id="system" placeholder="Kamu adalah asisten yang ringkas dan akurat."></textarea>
        <div class="btnrow">
          <button class="btn primary" id="bake" title="Prefill system prompt sekali ke RAM GPU → TTFT berikutnya jauh lebih cepat">⚡ Bake ke GPU</button>
          <button class="btn" id="unbake" title="Hapus snapshot system prompt dari RAM GPU">✕ Hapus bake</button>
        </div>
      </div>
    </section>

    <section class="sec">
      <h3>SAMPLING</h3>
      <div class="in" id="params"></div>
    </section>

    <section class="sec">
      <h3>KONEKSI</h3>
      <div class="in">
        <label for="base">URL server</label>
        <input type="text" id="base" placeholder="(sama dengan halaman ini)">
        <label for="key">API key (jika server memakai --api-key)</label>
        <input type="password" id="key" autocomplete="off">
        <div class="btnrow"><button class="btn" id="reconnect">Sambungkan ulang</button></div>
      </div>
    </section>
  </aside>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
// ───────────────────────── util ─────────────────────────
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("bihaba." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("bihaba." + k, JSON.stringify(v)); } catch {} },
};
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 1800); }
function fmtMs(ms) { return ms == null ? "—" : ms < 1000 ? ms.toFixed(0) + " ms" : (ms / 1000).toFixed(2) + " s"; }
function fmtUp(s) { if (!s) return "—"; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}j ${m}m` : `${m}m ${Math.floor(s % 60)}d`; }

// ───────────────────────── markdown (aman: escape dulu) ─────────────────────────
function inlineMd(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function renderMd(src) {
  const parts = src.split(/```/);
  let html = "";
  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      const nl = part.indexOf("\n");
      const lang = nl > -1 ? part.slice(0, nl).trim() : "";
      const code = nl > -1 ? part.slice(nl + 1) : part;
      html += `<div class="code"><header><span>${esc(lang || "kode")}</span><button data-copy>salin</button></header><pre><code>${esc(code.replace(/\n$/, ""))}</code></pre></div>`;
      return;
    }
    const lines = esc(part).split("\n");
    let list = null, para = [];
    const flushP = () => { if (para.length) { html += `<p>${inlineMd(para.join("<br>"))}</p>`; para = []; } };
    const flushL = () => { if (list) { html += `</${list}>`; list = null; } };
    for (const ln of lines) {
      let m;
      if ((m = ln.match(/^(#{1,3})\s+(.*)/))) { flushP(); flushL(); const n = m[1].length; html += `<h${n}>${inlineMd(m[2])}</h${n}>`; }
      else if ((m = ln.match(/^\s*[-*]\s+(.*)/))) { flushP(); if (list !== "ul") { flushL(); html += "<ul>"; list = "ul"; } html += `<li>${inlineMd(m[1])}</li>`; }
      else if ((m = ln.match(/^\s*\d+[.)]\s+(.*)/))) { flushP(); if (list !== "ol") { flushL(); html += "<ol>"; list = "ol"; } html += `<li>${inlineMd(m[1])}</li>`; }
      else if (!ln.trim()) { flushP(); flushL(); }
      else { flushL(); para.push(ln); }
    }
    flushP(); flushL();
  });
  return html;
}
// Qwen: penalaran ada di <think>…</think>; dengan thinking aktif, tag pembuka sudah ada di prompt.
function splitThink(text) {
  const close = text.indexOf("</think>");
  const open = text.indexOf("<think>");
  if (close === -1) {
    if (open !== -1) return { think: text.slice(open + 7), answer: text.slice(0, open), thinking: true };
    return { think: "", answer: text, thinking: false };
  }
  const start = open !== -1 && open < close ? open + 7 : 0;
  return { think: text.slice(start, close).trim(), answer: (open > 0 ? text.slice(0, open) : "") + text.slice(close + 8), thinking: false };
}

// ───────────────────────── state ─────────────────────────
const PARAMS = [
  { k: "temperature", label: "Temperature", min: 0, max: 1.5, step: 0.05, def: 0.6 },
  { k: "top_p", label: "Top-p", min: 0.05, max: 1, step: 0.01, def: 0.95 },
  { k: "top_k", label: "Top-k", min: 1, max: 64, step: 1, def: 40 },
  { k: "min_p", label: "Min-p", min: 0, max: 0.5, step: 0.01, def: 0.05 },
  { k: "repetition_penalty", label: "Repetition penalty (1 = mati)", min: 1, max: 1.5, step: 0.01, def: 1.0 },
  { k: "max_tokens", label: "Maks token balasan", min: 16, max: 8192, step: 16, def: 1024 },
];
let params = Object.assign(Object.fromEntries(PARAMS.map((p) => [p.k, p.def])), store.get("params", {}));
let chats = store.get("chats", []);
let currentId = store.get("current", null);
let tpsHistory = store.get("tps", []);
let health = null, controller = null, busy = false;
const conn = () => ({ base: ($("base").value || "").replace(/\/$/, ""), key: $("key").value });

function current() { return chats.find((c) => c.id === currentId); }
function saveChats() { store.set("chats", chats.slice(0, 200)); store.set("current", currentId); }
function newChat() {
  const c = { id: uid(), title: "Percakapan baru", messages: [], created: Date.now() };
  chats.unshift(c); currentId = c.id; saveChats(); renderSide(); renderLog(); $("input").focus();
}

// ───────────────────────── API ─────────────────────────
function headers(json) {
  const h = {}; if (json) h["Content-Type"] = "application/json";
  const { key } = conn(); if (key) h["Authorization"] = "Bearer " + key;
  return h;
}
async function api(path, body) {
  const { base } = conn();
  const r = await fetch(base + path, body ? { method: "POST", headers: headers(true), body: JSON.stringify(body) } : { headers: headers(false) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j?.error?.message || j?.error || `HTTP ${r.status}`);
  return j;
}
function setStatus(kind, text) { $("dot").className = "dot " + kind; $("status").textContent = text; }

async function refreshHealth() {
  try {
    health = await api("/health");
    setStatus(busy ? "busy" : "ok", busy ? "menghasilkan…" : "terhubung");
    $("activePill").textContent = health.active_model || "—";
    $("kArch").textContent = health.arch || "—";
    $("kTopk").textContent = health.top_k || "—";
    $("kSeq").textContent = health.max_seq ? health.max_seq.toLocaleString("id") + " tok" : "—";
    $("kBaked").textContent = (health.baked_prefix_tokens || 0) + " tok";
    $("kReq").textContent = health.total_requests ?? "—";
    $("kUp").textContent = fmtUp(health.uptime_sec);
    const sel = $("model");
    if (health.active_model && sel.value !== health.active_model && !busy && document.activeElement !== sel) {
      if (![...sel.options].some((o) => o.value === health.active_model)) sel.add(new Option(health.active_model, health.active_model));
      sel.value = health.active_model;
    }
  } catch (e) {
    setStatus("err", "server tidak terjangkau");
  }
}
async function loadModels() {
  const sel = $("model");
  try {
    const j = await api("/v1/models");
    sel.innerHTML = "";
    for (const m of j.data || []) sel.add(new Option(`${m.id}  · ${m.arch || m.engine || ""}`, m.id));
    if (!sel.options.length && health?.active_model) sel.add(new Option(health.active_model, health.active_model));
    if (health?.active_model) sel.value = health.active_model;
    if ((j.data || []).length <= 1) sel.title = "Jalankan server dengan --models-dir ~/models untuk memilih banyak model";
  } catch (e) {
    sel.innerHTML = ""; sel.add(new Option(health?.active_model || "(tidak bisa memuat daftar)", health?.active_model || ""));
    if (/401/.test(e.message) || /API key/i.test(e.message)) toast("Server meminta API key — isi di panel Koneksi");
  }
}

// ───────────────────────── render ─────────────────────────
function renderSide() {
  const box = $("chats"); box.innerHTML = "";
  for (const c of chats) {
    const el = document.createElement("div");
    el.className = "chat-item" + (c.id === currentId ? " active" : "");
    el.innerHTML = `<span>${esc(c.title)}</span><button title="Hapus" aria-label="Hapus percakapan">✕</button>`;
    el.onclick = (ev) => {
      if (ev.target.tagName === "BUTTON") {
        chats = chats.filter((x) => x.id !== c.id);
        if (currentId === c.id) currentId = chats[0]?.id || null;
        saveChats(); renderSide(); renderLog(); return;
      }
      if (busy) return;
      currentId = c.id; saveChats(); renderSide(); renderLog(); $("side").classList.remove("open");
    };
    box.appendChild(el);
  }
}
function statChips(st, ttft) {
  if (!st) return "";
  const c = [];
  if (st.tps) c.push(`<span class="chip"><b>${st.tps}</b> tok/s</span>`);
  if (st.tokens != null) c.push(`<span class="chip">${st.tokens} token</span>`);
  if (ttft != null) c.push(`<span class="chip c">TTFT <b>${fmtMs(ttft)}</b></span>`);
  if (st.prefill_ms != null) c.push(`<span class="chip">prefill ${fmtMs(st.prefill_ms)}</span>`);
  if (st.tok_per_step) c.push(`<span class="chip c"><b>${st.tok_per_step}</b> tok/langkah</span>`);
  if (st.reused) c.push(`<span class="chip">reuse ${st.reused} tok</span>`);
  if (st.model) c.push(`<span class="chip">${esc(st.model)}</span>`);
  return `<div class="meta">${c.join("")}</div>`;
}
function botHtml(m, streaming) {
  if (m.error) return `<div class="err">✗ ${esc(m.error)}</div>`;
  const { think, answer, thinking } = splitThink(m.content || "");
  let h = "";
  if (think || thinking) h += `<details class="think"${thinking ? " open" : ""}><summary>${thinking ? "berpikir…" : "penalaran"}</summary><div class="tb">${esc(think)}</div></details>`;
  h += renderMd(answer);
  if (streaming) h += '<span class="caret"></span>';
  return h;
}
function msgEl(m, idx) {
  const el = document.createElement("div");
  el.className = "msg " + (m.role === "user" ? "user" : "bot");
  el.dataset.idx = idx;
  if (m.role === "user") {
    el.innerHTML = `<div class="av">KAU</div><div class="body"><div class="bubble"></div><div class="actions"><button data-act="edit">sunting</button><button data-act="copy">salin</button></div></div>`;
    el.querySelector(".bubble").textContent = m.content;
  } else {
    el.innerHTML = `<div class="av">AI</div><div class="body"><div class="bubble">${botHtml(m, false)}</div>${statChips(m.stats, m.ttft)}<div class="actions"><button data-act="copy">salin</button><button data-act="regen">ulang</button></div></div>`;
  }
  return el;
}
function renderLog() {
  const log = $("log"); log.innerHTML = "";
  const c = current();
  if (!c || !c.messages.length) {
    log.innerHTML = `<div class="empty"><h1>BIHABA<span>_</span></h1><div>Inference Metal native di Mac-mu. Tanpa cloud, tanpa data keluar.</div>
      <div class="starters">
        <button data-s="Jelaskan perbedaan prefill dan decode pada LLM, dengan analogi sederhana."><b>Belajar konsep</b>prefill vs decode</button>
        <button data-s="Tulis fungsi Python yang membaca CSV besar secara streaming dan menghitung rata-rata per kolom."><b>Tulis kode</b>CSV streaming</button>
        <button data-s="Ringkas teks berikut menjadi 5 poin penting:\n\n"><b>Ringkas</b>tempel teks panjang</button>
        <button data-s="Buat output JSON valid berisi 5 ide nama produk kopi lokal Aceh dengan field name, tagline, target."><b>JSON terstruktur</b>spekulasi paling kencang</button>
      </div></div>`;
    return;
  }
  c.messages.forEach((m, i) => log.appendChild(msgEl(m, i)));
  log.scrollTop = log.scrollHeight;
}
function renderParams() {
  const box = $("params"); box.innerHTML = "";
  for (const p of PARAMS) {
    const wrap = document.createElement("div");
    wrap.innerHTML = `<label for="p_${p.k}">${p.label}</label><div class="slider"><input type="range" id="p_${p.k}" min="${p.min}" max="${p.max}" step="${p.step}"><input type="number" min="${p.min}" max="${p.max}" step="${p.step}" aria-label="${p.label}"></div>`;
    const [r, n] = wrap.querySelectorAll("input");
    r.value = n.value = params[p.k];
    const upd = (v) => { v = Math.min(p.max, Math.max(p.min, Number(v))); if (Number.isNaN(v)) return; params[p.k] = v; r.value = n.value = v; store.set("params", params); };
    r.oninput = () => upd(r.value); n.onchange = () => upd(n.value);
    box.appendChild(wrap);
  }
  const t = document.createElement("label"); t.className = "toggle";
  t.innerHTML = `<input type="checkbox" id="pSeed"> seed tetap (hasil bisa diulang)`;
  box.appendChild(t);
  $("pSeed").checked = !!params.fixed_seed;
  $("pSeed").onchange = (e) => { params.fixed_seed = e.target.checked; store.set("params", params); };
  const rst = document.createElement("div"); rst.className = "btnrow";
  rst.innerHTML = `<button class="btn" id="pReset">Reset default</button><button class="btn" id="pGreedy">Greedy (paling cepat)</button>`;
  box.appendChild(rst);
  $("pReset").onclick = () => { params = Object.fromEntries(PARAMS.map((p) => [p.k, p.def])); store.set("params", params); renderParams(); };
  $("pGreedy").onclick = () => { params.temperature = 0; store.set("params", params); renderParams(); toast("Temperature 0: output deterministik, spekulasi maksimal"); };
}
function drawSpark() {
  const cv = $("spark"), g = cv.getContext("2d"), W = cv.width, H = cv.height;
  g.clearRect(0, 0, W, H);
  const d = tpsHistory.slice(-40);
  if (!d.length) { g.fillStyle = "#5b6878"; g.font = "22px ui-monospace,monospace"; g.fillText("belum ada data", 12, H / 2 + 8); return; }
  const mx = Math.max(...d) * 1.15 || 1, step = W / Math.max(1, d.length - 1);
  g.strokeStyle = "#1e2733"; g.lineWidth = 1;
  for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(0, H * i / 4); g.lineTo(W, H * i / 4); g.stroke(); }
  const pts = d.map((v, i) => [d.length === 1 ? W / 2 : i * step, H - (v / mx) * (H - 8) - 4]);
  const grad = g.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, "#ffb22455"); grad.addColorStop(1, "#ffb22400");
  g.beginPath(); g.moveTo(pts[0][0], H); pts.forEach(([x, y]) => g.lineTo(x, y)); g.lineTo(pts[pts.length - 1][0], H); g.fillStyle = grad; g.fill();
  g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.strokeStyle = "#ffb224"; g.lineWidth = 3; g.stroke();
  const [lx, ly] = pts[pts.length - 1]; g.fillStyle = "#ffb224"; g.beginPath(); g.arc(lx, ly, 5, 0, 7); g.fill();
}
function updateTelemetry(st, ttft) {
  if (!st) return;
  $("gTps").textContent = st.tps ?? "—";
  $("kTtft").textContent = fmtMs(ttft);
  $("kPre").textContent = fmtMs(st.prefill_ms);
  $("kTps").textContent = st.tok_per_step ?? "—";
  $("kReuse").textContent = (st.reused ?? 0) + " / " + (st.prompt_tokens ?? "?") + " tok";
  $("lastFinish").textContent = st.finish_reason || "";
  if (st.tps) { tpsHistory.push(st.tps); tpsHistory = tpsHistory.slice(-200); store.set("tps", tpsHistory); }
  drawSpark();
}

// ───────────────────────── generate ─────────────────────────
function setBusy(b) {
  busy = b;
  const s = $("send");
  s.textContent = b ? "Stop" : "Kirim"; s.classList.toggle("stop", b);
  s.disabled = !b && !$("input").value.trim();
  setStatus(b ? "busy" : (health ? "ok" : "err"), b ? "menghasilkan…" : (health ? "terhubung" : "server tidak terjangkau"));
}
function buildMessages(c) {
  const out = [];
  const sys = $("system").value.trim();
  if (sys) out.push({ role: "system", content: sys });
  for (const m of c.messages) if (!m.error && m.content) out.push({ role: m.role, content: m.role === "assistant" ? splitThink(m.content).answer.trim() : m.content });
  return out;
}
async function generate() {
  const c = current(); if (!c) return;
  const bot = { role: "assistant", content: "" };
  c.messages.push(bot);
  renderLog();
  const log = $("log"), el = log.lastElementChild, bubble = el.querySelector(".bubble");
  bubble.innerHTML = '<span class="caret"></span>';
  setBusy(true);
  controller = new AbortController();
  const t0 = performance.now(); let ttft = null, stats = null, raf = 0;
  const paint = () => { raf = 0; bubble.innerHTML = botHtml(bot, true); const near = log.scrollHeight - log.scrollTop - log.clientHeight < 140; if (near) log.scrollTop = log.scrollHeight; };
  try {
    const body = {
      messages: buildMessages(c),
      model: $("model").value || undefined, stream: true,
      temperature: params.temperature, top_p: params.top_p, top_k: params.top_k, min_p: params.min_p,
      repetition_penalty: params.repetition_penalty, max_tokens: params.max_tokens,
    };
    if (params.fixed_seed) body.seed = 42;
    const { base } = conn();
    const r = await fetch(base + "/v1/chat/completions", { method: "POST", headers: headers(true), body: JSON.stringify(body), signal: controller.signal });
    if (!r.ok || !r.body) { const j = await r.json().catch(() => ({})); throw new Error(j?.error?.message || `HTTP ${r.status}`); }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) !== -1) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        let obj; try { obj = JSON.parse(data); } catch { continue; }
        if (obj.error) throw new Error(obj.error.message || String(obj.error));
        const ch = obj.choices?.[0];
        if (ch?.delta?.content) { if (ttft === null) ttft = performance.now() - t0; bot.content += ch.delta.content; if (!raf) raf = requestAnimationFrame(paint); }
        if (obj.bihaba_stats) stats = Object.assign({}, obj.bihaba_stats, { model: obj.model });
      }
    }
  } catch (e) {
    if (e.name === "AbortError") { if (!bot.content) bot.error = "dihentikan"; }
    else { bot.error = e.message.includes("Failed to fetch") ? "Tidak bisa menghubungi server. Cek panel Koneksi (URL / API key / --cors)." : e.message; }
  } finally {
    if (raf) cancelAnimationFrame(raf);
    bot.stats = stats; bot.ttft = ttft;
    if (c.title === "Percakapan baru") { const u = c.messages.find((m) => m.role === "user"); if (u) c.title = u.content.slice(0, 48); }
    saveChats(); setBusy(false); controller = null;
    el.replaceWith(msgEl(bot, c.messages.length - 1));
    log.scrollTop = log.scrollHeight;
    renderSide(); updateTelemetry(stats, ttft); refreshHealth();
  }
}
function send() {
  if (busy) { controller?.abort(); return; }
  const text = $("input").value.trim(); if (!text) return;
  if (!current()) newChat();
  current().messages.push({ role: "user", content: text });
  $("input").value = ""; autosize(); generate();
}

// ───────────────────────── events ─────────────────────────
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(240, t.scrollHeight) + "px"; $("send").disabled = !busy && !t.value.trim(); }
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("send").onclick = send;
$("newChat").onclick = () => { if (!busy) newChat(); };
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if (!busy) newChat(); }
  if (e.key === "Escape" && busy) controller?.abort();
});
$("log").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.s !== undefined) { $("input").value = b.dataset.s; autosize(); $("input").focus(); return; }
  if (b.hasAttribute("data-copy")) { await navigator.clipboard.writeText(b.closest(".code").querySelector("code").textContent); toast("Kode disalin"); return; }
  const msg = b.closest(".msg"); if (!msg || busy) return;
  const c = current(), idx = Number(msg.dataset.idx), m = c.messages[idx];
  if (b.dataset.act === "copy") { await navigator.clipboard.writeText(m.role === "assistant" ? splitThink(m.content).answer.trim() : m.content); toast("Disalin"); }
  if (b.dataset.act === "regen") { c.messages = c.messages.slice(0, idx); saveChats(); generate(); }
  if (b.dataset.act === "edit") { $("input").value = m.content; c.messages = c.messages.slice(0, idx); saveChats(); renderLog(); autosize(); $("input").focus(); }
});
$("model").onchange = async () => {
  const v = $("model").value; if (!v || busy) return;
  setStatus("busy", "memuat " + v + "…");
  try {
    // Hot-swap terjadi di request berikutnya; picu sekarang dengan permintaan 1 token agar model siap.
    await api("/v1/chat/completions", { model: v, messages: [{ role: "user", content: "hi" }], max_tokens: 1, temperature: 0 });
    toast("Model aktif: " + v);
  } catch (e) { toast("Gagal ganti model: " + e.message); }
  refreshHealth();
};
$("bake").onclick = async () => {
  const sys = $("system").value.trim(); if (!sys) { toast("Isi system prompt dulu"); return; }
  setStatus("busy", "bake…");
  try { const r = await api("/v1/state/bake", { system: sys, model: $("model").value || undefined }); toast(`⚡ ${r.tokens ?? "?"} token di-bake ke GPU`); }
  catch (e) { toast("Bake gagal: " + e.message); }
  refreshHealth();
};
$("unbake").onclick = async () => {
  if (busy) return;
  try { const r = await api("/v1/state/clear", {}); toast(`Snapshot dihapus (${r.mb ?? 0} MB dibebaskan)`); }
  catch (e) { toast("Gagal menghapus: " + e.message); }
  refreshHealth();
};
$("system").value = store.get("system", "");
$("system").addEventListener("input", () => store.set("system", $("system").value));
$("base").value = store.get("base", ""); $("key").value = store.get("key", "");
$("reconnect").onclick = async () => { store.set("base", $("base").value.trim()); store.set("key", $("key").value); await refreshHealth(); await loadModels(); toast(health ? "Terhubung" : "Masih gagal terhubung"); };
$("sideBtn").onclick = () => $("side").classList.toggle("open");
$("panelBtn").onclick = () => $("panel").classList.toggle("open");
function download(name, text, type) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
$("exportMd").onclick = () => {
  const c = current(); if (!c) return;
  const md = `# ${c.title}\n\n` + c.messages.map((m) => `**${m.role === "user" ? "Kamu" : "AI"}:**\n\n${m.role === "assistant" ? splitThink(m.content || "").answer.trim() : m.content}\n`).join("\n");
  download((c.title || "chat").replace(/[^\w-]+/g, "_").slice(0, 40) + ".md", md, "text/markdown");
};
$("exportJson").onclick = () => download("bihaba-chats.json", JSON.stringify(chats, null, 2), "application/json");
$("importJson").onclick = () => $("importFile").click();
$("importFile").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw new Error("format salah");
    const ok = data.filter((c) => c && typeof c.id === "string" && Array.isArray(c.messages))
      .map((c) => ({ id: c.id, title: String(c.title || "Impor"), created: c.created || Date.now(),
        messages: c.messages.filter((m) => m && (m.role === "user" || m.role === "assistant")).map((m) => ({ role: m.role, content: String(m.content || "") })) }));
    const ids = new Set(chats.map((c) => c.id));
    chats = [...ok.filter((c) => !ids.has(c.id)), ...chats]; saveChats(); renderSide(); toast(`${ok.length} percakapan diimpor`);
  } catch (err) { toast("Impor gagal: " + err.message); }
  e.target.value = "";
};

// ───────────────────────── boot ─────────────────────────
(async function boot() {
  renderParams(); drawSpark();
  if (!chats.length) newChat(); else { if (!current()) currentId = chats[0].id; renderSide(); renderLog(); }
  await refreshHealth(); await loadModels();
  setInterval(() => { if (!busy) refreshHealth(); }, 5000);
  $("input").focus();
})();
</script>
</body>
